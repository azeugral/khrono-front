<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta name="theme-color" content="#F3EFE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
<link rel="alternate" hreflang="{{alt_lang}}" href="{{alt}}">
<link rel="icon" href="{{base}}assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{base}}assets/img/favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="{{base}}assets/img/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{{base}}assets/img/brand/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="{{base}}assets/img/brand/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" sizes="180x180" href="{{base}}assets/img/brand/apple-touch-icon.png">
<link rel="manifest" href="{{base}}assets/img/site.webmanifest">
<meta name="theme-color" content="#111111">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:image" content="{{base}}assets/img/brand/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{base}}assets/css/site.css">
<link rel="stylesheet" href="{{base}}assets/css/polish.css">
<link rel="stylesheet" href="{{base}}assets/css/product.css">
<link rel="stylesheet" href="{{base}}assets/css/lean.css">
</head>
<body>
{{header}}
<main>
{{main}}
</main>
{{footer}}
<script src="{{base}}assets/js/site.js"></script>
<script src="{{base}}assets/js/polish.js"></script>
</body>
</html>
