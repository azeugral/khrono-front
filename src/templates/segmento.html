<section class="pageHead">
  <div class="wrap">
    <div class="split">
      <div class="txt">
        <div class="crumbs"><a href="{{p_index}}">{{crumb_home}}</a><span>/</span><span>{{crumb}}</span><span>/</span><span>{{seg_nome}}</span></div>
        <span class="eyebrow">{{seg_nome}}</span>
        <h1 style="max-width:14ch">{{seg_h1}}</h1>
        <p class="lead">{{seg_lead}}</p>
        <div class="btns" style="margin-top:32px">
          <a class="btn acc lg" href="{{p_signup}}">{{b1}}</a>
          <a class="btn line lg" href="{{p_pricing}}">{{b2}}</a>
        </div>
      </div>
      <div class="photo"><img src="{{seg_img}}" alt="{{seg_nome}}" loading="eager"></div>
    </div>
  </div>
</section>

<section class="tight">
  <div class="wrap">
    <div class="g3">{{seg_dores}}</div>
  </div>
</section>

<section class="alt">
  <div class="wrap">
    <div class="split">
      <div class="txt">
        <span class="eyebrow">{{how}}</span>
        <h2>{{how_h2}}</h2>
        <ul class="list">{{seg_steps}}</ul>
      </div>
      <div class="phones one-phone"><div class="frame a"><span class="bar"><b>9:41</b><i></i><b>●●●</b></span><img src="{{seg_app}}" alt="" loading="lazy"></div></div>
    </div>
  </div>
</section>

<section>
  <div class="wrap wide">
    <div class="secHead">
      <span class="eyebrow">{{all_eyebrow}}</span>
      <h2>{{all_h2}}</h2>
    </div>
    <div class="chips left">{{seg_chips}}</div>
  </div>
</section>

<section class="alt priceSec">
  <div class="wrap wide">
    <div class="secHead center">
      <span class="eyebrow">{{plan_eyebrow}}</span>
      <h2>{{plan_h2}}</h2>
      <p class="lead center">{{plan_lead}}</p>
    </div>
    {{plans}}
  </div>
</section>

<section class="tight">
  <div class="wrap wide">
    <div class="cta">
      <h2>{{cta_h}}</h2>
      <p class="lead">{{cta_l}}</p>
      <div class="btns center">
        <a class="btn lg" href="{{p_signup}}">{{b1}}</a>
        <a class="btn line lg" href="{{p_pricing}}">{{cta_b2}}</a>
      </div>
    </div>
  </div>
</section>
