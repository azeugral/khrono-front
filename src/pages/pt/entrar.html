title: Entrar — {{marca}}
desc: Acesse o painel da {{marca}}.
alt: en/sign-in.html

<section class="pageHead center">
  <div class="wrap" style="max-width:460px">
    <span class="eyebrow">Entrar</span>
    <h1 style="font-size:clamp(2rem,4vw,2.8rem)">Bem-vindo de volta</h1>
    <form class="form" style="margin-top:32px;text-align:left" data-demo="login">
      <div class="fld"><label for="email">E-mail</label><input class="inp" id="email" name="email" type="email" required placeholder="voce@seunegocio.com.br"><div class="fmsg">Informe um e-mail válido.</div></div>
      <div class="fld"><label for="senha">Senha</label><input class="inp" id="senha" name="senha" type="password" required placeholder="••••••••"><div class="fmsg">Informe a senha.</div></div>
      <button class="btn acc wide" type="submit">Entrar</button>
      <p class="fine center">Esqueceu a senha? <a class="link" style="font-size:13px" data-say="Recuperação de senha entra junto com o cadastro" href="#">Recuperar acesso</a></p>
    </form>
    <p class="body center" style="margin:24px auto 0;font-size:14px">Ainda não tem conta? <a class="link" href="criar-conta.html">Criar conta <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></p>
  </div>
</section>
