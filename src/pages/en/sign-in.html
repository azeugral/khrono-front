title: Sign in — {{marca}}
desc: Access the {{marca}} dashboard.
alt: ../entrar.html

<section class="pageHead center">
  <div class="wrap" style="max-width:460px">
    <span class="eyebrow">Sign in</span>
    <h1 style="font-size:clamp(2rem,4vw,2.8rem)">Welcome back</h1>
    <form class="form" style="margin-top:32px;text-align:left" data-demo="login">
      <div class="fld"><label for="email">E-mail</label><input class="inp" id="email" name="email" type="email" required placeholder="you@yourbusiness.com"><div class="fmsg">Please enter a valid e-mail.</div></div>
      <div class="fld"><label for="senha">Password</label><input class="inp" id="senha" name="senha" type="password" required placeholder="••••••••"><div class="fmsg">Please enter your password.</div></div>
      <button class="btn acc wide" type="submit">Sign in</button>
      <p class="fine center">Forgot your password? <a class="link" style="font-size:13px" data-say="Password recovery ships together with sign-up" href="#">Recover access</a></p>
    </form>
    <p class="body center" style="margin:24px auto 0;font-size:14px">No account yet? <a class="link" href="sign-up.html">Create account <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></p>
  </div>
</section>
